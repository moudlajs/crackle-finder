[project]
name = "crackle-finder"
version = "0.1.0"
description = "Find crackles, clicks, clipping and dropouts in long spoken-word recordings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
crackle-finder = "crackle_finder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
# The prototype is kept verbatim as the regression reference.
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
